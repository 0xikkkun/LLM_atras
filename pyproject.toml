[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-atras"
version = "0.1.0"
description = "Compare language models through representation graphs and distance-based maps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.7"]

[project.optional-dependencies]
models = ["torch>=2.5", "transformers>=5.8", "safetensors", "datasets", "huggingface-hub"]
analysis = ["matplotlib>=3.7", "umap-learn>=0.5", "POT>=0.9", "adjustText>=1.3"]
dev = ["pytest>=7", "build"]

[project.scripts]
llm-atras = "llm_atras.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
